apiVersion: topologies.eda.nokia.com/v1
kind: NetworkTopology
metadata:
  name: 3-stage-evpn-vxlan
  namespace: eda
spec:
  operation: Reconcile
  nodeTemplates:
  - name: leaf
    labels:
      eda.nokia.com/role: leaf
      eda.nokia.com/security-profile: managed
    annotations:
      topobuilder.eda.labs/name-prefix: leaf
    nodeProfile: srlinux-ghcr-26.3.1
    platform: 7220 IXR-D3L
  - name: spine
    labels:
      eda.nokia.com/role: spine
      eda.nokia.com/security-profile: managed
    annotations:
      topobuilder.eda.labs/name-prefix: spine
    nodeProfile: srlinux-ghcr-26.3.1
    platform: 7220 IXR-D3L
  nodes:
  - name: spine1
    template: spine
    annotations:
      topobuilder.eda.labs/x: '1100'
      topobuilder.eda.labs/y: '60'
  - name: spine2
    template: spine
    annotations:
      topobuilder.eda.labs/x: '1620'
      topobuilder.eda.labs/y: '60'
  - name: leaf1
    template: leaf
    annotations:
      topobuilder.eda.labs/x: '60'
      topobuilder.eda.labs/y: '520'
  - name: leaf2
    template: leaf
    annotations:
      topobuilder.eda.labs/x: '580'
      topobuilder.eda.labs/y: '520'
  - name: leaf3
    template: leaf
    annotations:
      topobuilder.eda.labs/x: '1100'
      topobuilder.eda.labs/y: '520'
  - name: leaf4
    template: leaf
    annotations:
      topobuilder.eda.labs/x: '1620'
      topobuilder.eda.labs/y: '520'
  - name: leaf5
    template: leaf
    annotations:
      topobuilder.eda.labs/x: '2140'
      topobuilder.eda.labs/y: '520'
  - name: leaf6
    template: leaf
    annotations:
      topobuilder.eda.labs/x: '2660'
      topobuilder.eda.labs/y: '520'
  linkTemplates:
  - name: isl
    type: InterSwitch
    speed: 100G
    encapType: 'Null'
    labels:
      eda.nokia.com/role: InterSwitch
  - name: edge
    type: Edge
    encapType: Dot1q
    labels:
      eda.nokia.com/role: Edge
  links:
  - name: spine1-leaf1-1
    endpoints:
    - local:
        node: leaf1
        interface: ethernet-1-1
      remote:
        node: spine1
        interface: ethernet-1-1
    template: isl
  - name: spine2-leaf1-1
    endpoints:
    - local:
        node: leaf1
        interface: ethernet-1-2
      remote:
        node: spine2
        interface: ethernet-1-1
    template: isl
  - name: spine1-leaf2-1
    endpoints:
    - local:
        node: leaf2
        interface: ethernet-1-1
      remote:
        node: spine1
        interface: ethernet-1-2
    template: isl
  - name: spine2-leaf2-1
    endpoints:
    - local:
        node: leaf2
        interface: ethernet-1-2
      remote:
        node: spine2
        interface: ethernet-1-2
    template: isl
  - name: spine1-leaf3-1
    endpoints:
    - local:
        node: leaf3
        interface: ethernet-1-1
      remote:
        node: spine1
        interface: ethernet-1-3
    template: isl
  - name: spine2-leaf3-1
    endpoints:
    - local:
        node: leaf3
        interface: ethernet-1-2
      remote:
        node: spine2
        interface: ethernet-1-3
    template: isl
  - name: spine1-leaf4-1
    endpoints:
    - local:
        node: leaf4
        interface: ethernet-1-1
      remote:
        node: spine1
        interface: ethernet-1-4
    template: isl
  - name: spine2-leaf4-1
    endpoints:
    - local:
        node: leaf4
        interface: ethernet-1-2
      remote:
        node: spine2
        interface: ethernet-1-4
    template: isl
  - name: spine1-leaf5-1
    endpoints:
    - local:
        node: leaf5
        interface: ethernet-1-1
      remote:
        node: spine1
        interface: ethernet-1-5
    template: isl
  - name: spine2-leaf5-1
    endpoints:
    - local:
        node: leaf5
        interface: ethernet-1-2
      remote:
        node: spine2
        interface: ethernet-1-5
    template: isl
  - name: spine1-leaf6-1
    endpoints:
    - local:
        node: leaf6
        interface: ethernet-1-1
      remote:
        node: spine1
        interface: ethernet-1-6
    template: isl
  - name: spine2-leaf6-1
    endpoints:
    - local:
        node: leaf6
        interface: ethernet-1-2
      remote:
        node: spine2
        interface: ethernet-1-6
    template: isl
  - name: s1-leaf1
    endpoints:
    - local:
        node: leaf1
        interface: ethernet-1-3
      sim:
        simNode: s1
        simNodeInterface: eth1
    template: edge
  - name: s2-esi-lag
    endpoints:
    - local:
        node: leaf2
        interface: ethernet-1-3
      sim:
        simNode: s2
        simNodeInterface: eth1
    - local:
        node: leaf3
        interface: ethernet-1-3
      sim:
        simNode: s2
        simNodeInterface: eth2
    template: edge
  - name: s3-leaf4
    endpoints:
    - local:
        node: leaf4
        interface: ethernet-1-3
      sim:
        simNode: s3
        simNodeInterface: eth1
    template: edge
  - name: s4-esi-lag
    endpoints:
    - local:
        node: leaf4
        interface: ethernet-1-4
      sim:
        simNode: s4
        simNodeInterface: eth1
    - local:
        node: leaf5
        interface: ethernet-1-4
      sim:
        simNode: s4
        simNodeInterface: eth2
    template: edge
  - name: s5-leaf1
    endpoints:
    - local:
        node: leaf1
        interface: ethernet-1-4
      sim:
        simNode: s5
        simNodeInterface: eth1
    template: edge
  - name: s6-esi-lag
    endpoints:
    - local:
        node: leaf5
        interface: ethernet-1-5
      sim:
        simNode: s6
        simNodeInterface: eth1
    - local:
        node: leaf6
        interface: ethernet-1-5
      sim:
        simNode: s6
        simNodeInterface: eth2
    template: edge
  - name: s7-leaf1
    endpoints:
    - local:
        node: leaf1
        interface: ethernet-1-5
      sim:
        simNode: s7
        simNodeInterface: eth1
    template: edge
  - name: s8-esi-lag
    endpoints:
    - local:
        node: leaf2
        interface: ethernet-1-6
      sim:
        simNode: s8
        simNodeInterface: eth1
    - local:
        node: leaf3
        interface: ethernet-1-6
      sim:
        simNode: s8
        simNodeInterface: eth2
    - local:
        node: leaf4
        interface: ethernet-1-6
      sim:
        simNode: s8
        simNodeInterface: eth3
    - local:
        node: leaf5
        interface: ethernet-1-6
      sim:
        simNode: s8
        simNodeInterface: eth4
    template: edge
  - name: s9-leaf6
    endpoints:
    - local:
        node: leaf6
        interface: ethernet-1-6
      sim:
        simNode: s9
        simNodeInterface: eth1
    template: edge
  simulation:
    simNodeTemplates:
    - name: testman
      type: TestMan
    - name: multitool
      type: Linux
      image: ghcr.io/srl-labs/network-multitool:latest
    simNodes:
    - name: s1
      template: multitool
      annotations:
        topobuilder.eda.labs/x: '60'
        topobuilder.eda.labs/y: '980'
    - name: s5
      template: multitool
      annotations:
        topobuilder.eda.labs/x: '340'
        topobuilder.eda.labs/y: '980'
    - name: s7
      template: multitool
      annotations:
        topobuilder.eda.labs/x: '620'
        topobuilder.eda.labs/y: '980'
    - name: s2
      template: multitool
      annotations:
        topobuilder.eda.labs/x: '900'
        topobuilder.eda.labs/y: '980'
    - name: s8
      template: multitool
      annotations:
        topobuilder.eda.labs/x: '1360'
        topobuilder.eda.labs/y: '980'
    - name: s3
      template: multitool
      annotations:
        topobuilder.eda.labs/x: '1640'
        topobuilder.eda.labs/y: '980'
    - name: s4
      template: multitool
      annotations:
        topobuilder.eda.labs/x: '1920'
        topobuilder.eda.labs/y: '980'
    - name: s6
      template: multitool
      annotations:
        topobuilder.eda.labs/x: '2400'
        topobuilder.eda.labs/y: '980'
    - name: s9
      template: multitool
      annotations:
        topobuilder.eda.labs/x: '2680'
        topobuilder.eda.labs/y: '980'
