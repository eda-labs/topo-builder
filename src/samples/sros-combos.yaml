          slot: 1-a-1
          type: c1-400g
      annotations:
        topobuilder.eda.labs/x: "1750"
        topobuilder.eda.labs/y: "860"
    - name: sr2se
      platform: 7750 SR-2se
      nodeProfile: sros-ghcr-25.7.r1
      components:
        - kind: mda
          slot: "1"
          type: x2-s36-800g-qsfpdd-18.0t
        - kind: mda
          slot: "2"
          type: mse6-800g-qsfpdd
        - kind: connector
          slot: 1-a-1
          type: c1-800g
      annotations:
        topobuilder.eda.labs/x: "2680"
        topobuilder.eda.labs/y: "860"
    - name: spine1
      template: srl-spine
      annotations:
        topobuilder.eda.labs/x: "1200"
        topobuilder.eda.labs/y: "1350"
  linkTemplates:
    - name: isl
      type: InterSwitch
      speed: 25G
      encapType: "Null"
      labels:
        eda.nokia.com/role: InterSwitch
    - name: edge
      type: Edge
      encapType: Dot1q
      labels:
        eda.nokia.com/role: Edge
  links:
    - name: sr1-24d-spine1
      annotations:
        topobuilder.eda.labs/edgeId: edge-14
        topobuilder.eda.labs/memberIndex: "0"
      endpoints:
        - local:
            node: spine1
            interface: ethernet-1-1
          remote:
            node: sr1-24d
            interface: ethernet-1-a-1
      template: isl
    - name: sr1-46s-spine1
      annotations:
        topobuilder.eda.labs/edgeId: edge-15
        topobuilder.eda.labs/memberIndex: "0"
