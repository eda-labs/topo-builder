apiVersion: topologies.eda.nokia.com/v1
kind: NetworkTopology
metadata:
  name: sros-combos-example
  namespace: sros
spec:
  operation: Reconcile
  nodeTemplates:
    - name: srl-spine
      labels:
        eda.nokia.com/role: spine
        eda.nokia.com/security-profile: managed
      annotations:
        topobuilder.eda.labs/name-prefix: spine
      nodeProfile: srlinux-ghcr-26.3.1
      platform: 7220 IXR-H4
  nodes:
    - name: sr1-24d
      platform: 7750 SR-1
      nodeProfile: sros-ghcr-25.7.r1
      components:
        - kind: lineCard
          slot: "1"
          type: i24-800g-qsfpdd-1
        - kind: connector
          slot: 1-a-1
          type: c1-800g
        - kind: connector
          slot: 1-a-3
          type: c2-400g
      annotations:
        topobuilder.eda.labs/x: "60"
        topobuilder.eda.labs/y: "60"
    - name: sr1-46s
      platform: 7750 SR-1
      nodeProfile: sros-ghcr-25.7.r1
      components:
        - kind: lineCard
          slot: "1"
          type: i40-200g-sfpdd+6-800g-qsfpdd-1
        - kind: connector
          slot: 1-a-1
          type: c1-200g
      annotations:
        topobuilder.eda.labs/x: "820"
        topobuilder.eda.labs/y: "60"
    - name: sr1-48d
      platform: 7750 SR-1
      nodeProfile: sros-ghcr-25.7.r1
      components:
        - kind: lineCard
          slot: "1"
          type: i48-400g-qsfpdd-1
        - kind: connector
          slot: 1-a-1
          type: c1-400g
      annotations:
        topobuilder.eda.labs/x: "1750"
        topobuilder.eda.labs/y: "60"
    - name: sr1x-92s
      platform: 7750 SR-1
      nodeProfile: sros-ghcr-25.7.r1
      components:
        - kind: lineCard
          slot: "1"
          type: i80-200g-sfpdd+12-800g-qsfpdd-1x
        - kind: connector
          slot: 1-a-1
          type: c1-200g
      annotations:
        topobuilder.eda.labs/x: "2680"
        topobuilder.eda.labs/y: "60"
    - name: sr1-mda
      platform: 7750 SR-1
      nodeProfile: sros-ghcr-25.7.r1
      components:
        - kind: mda
          slot: "1"
          type: me12-100gb-qsfp28
        - kind: mda
          slot: "2"
          type: me6-100gb-qsfp28
        - kind: connector
          slot: 1-a-1
          type: c1-100g
        - kind: connector
          slot: 1-b-1
          type: c1-100g
