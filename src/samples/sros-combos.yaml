        topobuilder.eda.labs/y: "860"
    - name: sr1s-combo
      platform: 7750 SR-1s
      nodeProfile: sros-ghcr-25.7.r1
      components:
        - kind: mda
          slot: "1"
          type: ms18-100gb-qsfp28
        - kind: mda
          slot: "2"
          type: ms4-400gb-qsfpdd+4-100gb-qsfp28
        - kind: connector
          slot: 1-a-1
          type: c1-100g
      annotations:
        topobuilder.eda.labs/x: "820"
        topobuilder.eda.labs/y: "860"
    - name: sr2s
      platform: 7750 SR-2s
      nodeProfile: sros-ghcr-25.7.r1
      components:
        - kind: mda
          slot: "1"
          type: s36-400gb-qsfpdd
        - kind: mda
          slot: "2"
          type: s18-100gb-qsfp28
